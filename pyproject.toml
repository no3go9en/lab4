[project]
name = "lab4"
version = "0.1.0"
description = "ЛР4: Data Persistence & Web Interfaces — REST API «Музичний інструмент» (FastAPI + PostgreSQL)"
readme = "README.md"
authors = [{ name = "Теплухін Роман", email = "roman.teplukhin1303@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.5",
    "psycopg[binary]>=3.3.8",
    "uvicorn>=0.54.0",
]

[project.scripts]
lab4-init-db = "lab4.init_db:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # кирилиця в рядках/коментарях

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
exclude = ["^\\.venv/"]
